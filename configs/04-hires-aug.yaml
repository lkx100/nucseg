# Spec 04: arm C plus strong augmentation. Differs from 02-hires.yaml only in data.aug.
model:
  encoder: swin_tiny_patch4_window7_224   # ImageNet-1k weights; window resized to 8 for 256 crops
  pretrained: true
  window_size: 8
  hires_skip: true     # conv stem feeds the last two decoder stages at 1/2 and full resolution
  decoder_channels: [256, 128, 64, 32, 16]
data:
  crop: 256
  crops_per_image: 4
  scale: [0.75, 1.25]
  brightness: 0.05     # added, in [0, 1] pixel units
  contrast: 0.1        # multiplied, 1 +/- this
  aug:                 # strong augmentation; leave out to turn it off
    elastic_p: 0.3     # chance of a smooth random warp
    elastic_px: 3      # displacement std in pixels at the lattice points
    elastic_grid: 8    # lattice points per side (32 px apart on a 256 crop)
    hue: 0.05          # hue shift, fraction of the colour wheel; grayscale images are unchanged
    saturation: 0.3    # multiplied, 1 +/- this
    gamma: [0.7, 1.4]  # log-uniform
    blur_p: 0.2
    blur_sigma: [0.3, 1.5]
    noise_p: 0.2
    noise_std: 0.03    # max std of Gaussian noise, [0, 1] pixel units
train:
  folds: [0, 1, 2, 3, 4]
  batch_size: 16
  max_epochs: 60
  patience: 10         # epochs without stop-set gain
  warmup_epochs: 3
  lr: 1.0e-4
  weight_decay: 0.01
  amp: true
  num_workers: 2
  seed: 0
nsl:
  alpha: 0.0           # weight of the adversarial neighbour loss; 0 turns NSL off
  eps_255: 2           # perturbation size in 1/255 pixel units, L-infinity
eval:
  tile: 256
  overlap: 0.5
  robust_eps_255: 2    # FGSM size for the robustness score
  tta: true            # also score the validation fold with 8-orientation TTA
