# Spec 13, second run: as 13-scse-test.yaml, without test photo adc315bd, whose hand-drawn answer has 5 of about
# 15 nuclei (the model's correct finds count as errors). 66 test images. No training.
# Each fold's model scores all 67 images, so the fold table has five rows on the same images.
members:               # kernel slug whose output holds ckpt/fold<k>.pt, and the config that built its model
  - name: "M"
    slug: s11-scse
    config: configs/11-scse.yaml
folds: [0, 1, 2, 3, 4]
data:
  exclude:
    - 7b38c9173ebe69b4c6ba7e703c0c27f39305d9b2910f46405993d2ea7a963b80   # as in arm M; not in the test set
    - adc315bd40d699fd4e4effbcce81cd7162851007f485d754ad3b0472f73a86df   # test photo with 10 of 15 nuclei unlabelled
eval:
  split: test          # the 67 hold-out images instead of each fold's validation images
  tile: 256
  overlap: 0.5
  tta: true            # also score with 8-orientation TTA
