# Spec 09, arm J: arm C* under plain 5-fold CV. Differs from 06-hires-min30.yaml only in data.stop_set and data.exclude.
model:
  encoder: swin_tiny_patch4_window7_224   # ImageNet-1k weights; window resized to 8 for 256 crops
  pretrained: true
  window_size: 8
  hires_skip: true     # conv stem feeds the last two decoder stages at 1/2 and full resolution
  decoder_channels: [256, 128, 64, 32, 16]
data:
  crop: 256
  crops_per_image: 4
  scale: [0.75, 1.25]
  brightness: 0.05     # added, in [0, 1] pixel units
  contrast: 0.1        # multiplied, 1 +/- this
  stop_set: false      # train on all four other folds; the validation fold is scored every epoch and picks the kept weights
  exclude:             # dropped from training and from scoring
    - 7b38c9173ebe69b4c6ba7e703c0c27f39305d9b2910f46405993d2ea7a963b80   # mask has 26 pixels on an image full of nuclei
train:
  folds: [0, 1, 2, 3, 4]
  batch_size: 16
  max_epochs: 60
  min_epochs: 30       # no weights kept and no early stop before this epoch
  patience: 10         # epochs without gain on the validation fold
  warmup_epochs: 3
  lr: 1.0e-4
  weight_decay: 0.01
  amp: true
  num_workers: 2
  seed: 0
nsl:
  alpha: 0.0           # weight of the adversarial neighbour loss; 0 turns NSL off
  eps_255: 2           # perturbation size in 1/255 pixel units, L-infinity
eval:
  tile: 256
  overlap: 0.5
  robust_eps_255: 2    # FGSM size for the robustness score
  tta: true            # also score the validation fold with 8-orientation TTA
