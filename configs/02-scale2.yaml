# Spec 02, arm D: 2x input scale. Differs from 02-base.yaml in model.input_scale, and in batch 8 x 2
# accumulation steps (16 crops at 512 don't fit on a T4).
model:
  encoder: swin_tiny_patch4_window7_224   # ImageNet-1k weights; window resized to 8 for 256 crops
  pretrained: true
  window_size: 8
  input_scale: 2       # upsample 256 crops to 512 inside the model, average logits back down
  decoder_channels: [256, 128, 64, 32, 16]
data:
  crop: 256
  crops_per_image: 4
  scale: [0.75, 1.25]
  brightness: 0.05     # added, in [0, 1] pixel units
  contrast: 0.1        # multiplied, 1 +/- this
train:
  folds: [0, 1, 2, 3, 4]
  batch_size: 8
  accum_steps: 2       # 2 batches of 8 per update, so each update still sees 16 crops
  max_epochs: 60
  patience: 10         # epochs without stop-set gain
  warmup_epochs: 3
  lr: 1.0e-4
  weight_decay: 0.01
  amp: true
  num_workers: 2
  seed: 0
nsl:
  alpha: 0.0           # weight of the adversarial neighbour loss; 0 turns NSL off
  eps_255: 2           # perturbation size in 1/255 pixel units, L-infinity
eval:
  tile: 256
  overlap: 0.5
  robust_eps_255: 2    # FGSM size for the robustness score
  tta: true            # also score the validation fold with 8-orientation TTA
